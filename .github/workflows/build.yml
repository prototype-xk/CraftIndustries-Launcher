name: Build & Release Launcher

# Se déclenche quand vous poussez un tag de version, ex : v1.0.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # nécessaire pour publier la release et le fichier latest.yml

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build & publish (electron-builder -> GitHub Releases)
        run: npm run publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
