name: Build & Release Launcher

# Se déclenche quand vous poussez un tag de version, ex : v1.0.0
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:   # permet aussi un lancement manuel depuis l'onglet Actions

permissions:
  contents: write   # nécessaire pour publier la release et les fichiers latest*.yml

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Injecte le webhook Discord (partage de captures) depuis un secret du dépôt,
      # SANS jamais le mettre dans le code. Configurez-le dans :
      # Settings → Secrets and variables → Actions → New repository secret → DISCORD_WEBHOOK
      - name: Inject secrets
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -n "$DISCORD_WEBHOOK" ]; then
            printf '{ "discordWebhook": "%s" }' "$DISCORD_WEBHOOK" > src/main/secrets.json
            echo "secrets.json injecté"
          else
            echo "Pas de secret DISCORD_WEBHOOK — partage de captures désactivé dans ce build"
          fi

      - name: Build & publish (electron-builder -> GitHub Releases)
        run: npm run publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pas de signature de code sur le CI (pas de certificat Apple/Windows).
          CSC_IDENTITY_AUTO_DISCOVERY: false
