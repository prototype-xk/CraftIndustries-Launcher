name: Build & Release Launcher

# Se déclenche quand vous poussez un tag de version, ex : v1.0.0
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:   # permet aussi un lancement manuel depuis l'onglet Actions

permissions:
  contents: write   # nécessaire pour publier la release et les fichiers latest*.yml

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build & publish (electron-builder -> GitHub Releases)
        run: npm run publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pas de signature de code sur le CI (pas de certificat Apple/Windows).
          CSC_IDENTITY_AUTO_DISCOVERY: false
