appId: com.prototypexk.craftindustries
productName: CraftIndustries Launcher
copyright: Copyright © 2026 prototype-xk

directories:
  output: dist
  buildResources: build

# Fichiers inclus dans l'application packagée.
# electron-builder ajoute automatiquement les dépendances de production (node_modules).
files:
  - "src/**/*"
  - "package.json"
  - "!**/*.map"

# ===================== Windows =====================
win:
  target:
    - target: nsis
      arch: [x64]
  # icon: build/icon.ico   (déposez un .ico 256x256 puis décommentez)

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: CraftIndustries Launcher

# ===================== macOS =====================
# dmg = installeur ; zip = requis pour l'auto-update macOS.
# Build pour Intel (x64) ET Apple Silicon (arm64).
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  category: public.app-category.games
  # icon: build/icon.icns

# ===================== Linux =====================
# AppImage = portable et compatible auto-update.
linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Game
  # icon: build/icon.png

# La cible (owner/repo) est déduite du champ "repository" de package.json.
# Par défaut electron-builder crée une release en BROUILLON : on y publie
# les artefacts des 3 OS, puis on publie la release manuellement sur GitHub.
publish:
  provider: github
