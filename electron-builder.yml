appId: com.prototypexk.craftindustries
productName: CraftIndustries Launcher
copyright: Copyright © 2026 prototype-xk

directories:
  output: dist
  buildResources: build

# Fichiers inclus dans l'application packagée.
# electron-builder ajoute automatiquement les dépendances de production (node_modules).
files:
  - "src/**/*"
  - "package.json"
  - "!**/*.map"

# Icône optionnelle : déposez build/icon.ico (256x256) puis décommentez la ligne.
win:
  target:
    - nsis
  # icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: CraftIndustries Launcher

# La cible de publication (owner/repo) est déduite du champ "repository"
# de package.json. C'est ce qui alimente aussi l'auto-update (electron-updater).
publish:
  provider: github
